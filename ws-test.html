<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MYCHAT WebSocket Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

    <style>
        body {
            font-family: monospace;
            max-width: 900px;
            margin: 40px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            margin-right: 8px;
            cursor: pointer;
        }

        #log {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            color: #eee;
            min-height: 300px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <button onclick="typingStart()">Typing Start</button>
    <button onclick="typingStop()">Typing Stop</button>

    <h2>MYCHAT WebSocket Test</h2>

    <label>Access Token</label>
    <input id="token" placeholder="Paste access token only">

    <label>Conversation ID</label>
    <input id="conversationId" value="4">

    <button onclick="connect()">Connect</button>
    <button onclick="subscribeConversation()">Subscribe</button>
    <button onclick="disconnect()">Disconnect</button>

    <div id="log"></div>

    <script>
        let client = null;
        let subscription = null;

        function log(message) {
            const element = document.getElementById("log");

            element.textContent +=
                `[${new Date().toLocaleTimeString()}] ${message}\n`;
        }

        function connect() {

            const token =
                document.getElementById("token").value.trim();

            if (!token) {
                log("ERROR: Access token required");
                return;
            }

            client = new StompJs.Client({
                brokerURL: "ws://localhost:8080/ws",

                connectHeaders: {
                    Authorization: `Bearer ${token}`
                },

                reconnectDelay: 0,

                debug: function (message) {
                    console.log(message);
                },

                onConnect: function () {
                    log("CONNECTED");
                },

                onStompError: function (frame) {
                    log(
                        "STOMP ERROR: " +
                        frame.headers["message"]
                    );
                },

                onWebSocketError: function (error) {
                    log("WEBSOCKET ERROR");
                    console.error(error);
                },

                onWebSocketClose: function () {
                    log("CONNECTION CLOSED");
                }
            });

            client.activate();

            log("Connecting...");
        }

        function subscribeConversation() {

            if (!client || !client.connected) {
                log("ERROR: Connect first");
                return;
            }

            const conversationId =
                document
                    .getElementById("conversationId")
                    .value
                    .trim();

            const destination =
                `/topic/conversations/${conversationId}`;

            subscription =
                client.subscribe(
                    destination,
                    function (message) {

                        try {

                            const data =
                                JSON.parse(message.body);

                            log(
                                "EVENT:\n" +
                                JSON.stringify(
                                    data,
                                    null,
                                    2
                                )
                            );

                        } catch (error) {

                            log(
                                "RAW EVENT: " +
                                message.body
                            );
                        }
                    }
                );

            log(
                "SUBSCRIBED: " +
                destination
            );
        }

        function disconnect() {

            if (subscription) {
                subscription.unsubscribe();
                subscription = null;
            }

            if (client) {
                client.deactivate();
            }

            log("DISCONNECTED");
        }

        function typingStart() {

            if (!client || !client.connected) {
                log("ERROR: Connect first");
                return;
            }

            const conversationId =
                document
                    .getElementById("conversationId")
                    .value
                    .trim();

            client.publish({
                destination: "/app/typing/start",

                body: JSON.stringify({
                    conversationId: Number(conversationId)
                })
            });

            log("SENT: typing:start");
        }

        function typingStop() {

            if (!client || !client.connected) {
                log("ERROR: Connect first");
                return;
            }

            const conversationId =
                document
                    .getElementById("conversationId")
                    .value
                    .trim();

            client.publish({
                destination: "/app/typing/stop",

                body: JSON.stringify({
                    conversationId: Number(conversationId)
                })
            });

            log("SENT: typing:stop");
        }
    </script>

</body>

</html>
