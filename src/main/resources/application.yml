spring:
  application:
    name: chat-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Existing databases must already have an explicitly reviewed baseline.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

# Useful locally; the prod profile disables both unless explicitly enabled.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Keep Spring Security defaults without logging a generated development password.
logging:
  level:
    org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration: ERROR

server:
  port: ${PORT:${SERVER_PORT:8080}}

security:
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:30d}
  jwt:
    # Required Base64-encoded random key, at least 32 bytes before encoding.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:chat-backend}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

app:
  upload:
    directory: ${UPLOAD_DIR:uploads}
  origins:
    http: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    websocket: ${WEBSOCKET_ALLOWED_ORIGINS:*}

# Only the aggregate health status is exposed, without component or error details.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
