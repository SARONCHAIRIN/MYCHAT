spring:
  application:
    name: chat-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:312007}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # # Database already has 13 tables.
  # # Enable Flyway after we baseline the existing schema.
  # flyway:
  #   enabled: ${FLYWAY_ENABLED:false}
  #   baseline-on-migrate: false

  flyway:

    enabled: ${FLYWAY_ENABLED:false}

    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

  sql:
    init:
      mode: never

# API documentation is configured in Phase 5.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Keep Spring Security defaults without logging a generated development password.
logging:
  level:
    org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration: ERROR

server:
  port: ${SERVER_PORT:8080}

security:
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:30d}
  jwt:
    # Required Base64-encoded random key, at least 32 bytes before encoding.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:chat-backend}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
